appId: com.interviewcopilot.desktop
productName: Interview Copilot
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist

files:
  - out/**/*
  - package.json

protocols:
  - name: Interview Copilot Desktop Protocol
    schemes:
      - copilot

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
